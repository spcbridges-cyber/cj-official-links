
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C_J • Official Links</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ff3b3b22 0, #050509 45%, #000000 100%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .frame {
      max-width: 480px;
      width: 100%;
      border-radius: 18px;
      padding: 28px 22px 26px;
      background:
        radial-gradient(circle at top left, #ff404010 0, transparent 55%),
        radial-gradient(circle at bottom right, #ff404018 0, transparent 55%),
        #050509dd;
      box-shadow:
        0 0 55px rgba(255, 59, 59, 0.25),
        0 14px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
    }
    .title-block {
      text-align: center;
      margin-bottom: 20px;
    }
    .ep-tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ff8a8a;
      margin-bottom: 4px;
    }
    .main-title {
      font-size: 26px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ffe3e3;
      text-shadow:
        0 0 6px rgba(255, 75, 75, 0.9),
        0 0 16px rgba(255, 75, 75, 0.55);
      margin-bottom: 6px;
    }
    .artist-name {
      font-size: 14px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #b9b9c7;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 12px;
      color: #bfbfcb;
      opacity: 0.9;
    }
    .links {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      color: #f5f5f5;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(255, 64, 64, 0.14) 0, transparent 52%),
        linear-gradient(90deg, #161620, #13131b);
      position: relative;
      overflow: hidden;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.18s ease;
    }
    .link-btn span {
      position: relative;
      z-index: 2;
    }
    .link-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 90, 90, 0.32), transparent 40%, rgba(255, 90, 90, 0.18));
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .link-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 137, 137, 0.8);
      box-shadow:
        0 0 20px rgba(255, 81, 81, 0.42),
        0 10px 25px rgba(0, 0, 0, 0.8);
      background:
        radial-gradient(circle at top, rgba(255, 64, 64, 0.32) 0, transparent 55%),
        linear-gradient(90deg, #1c1c28, #171722);
    }
    .link-btn:hover::before {
      opacity: 1;
    }
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #86869a;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 10px;
      color: #79798b;
    }
    .footer span {
      color: #ff9a9a;
    }
    @media (max-width: 480px) {
      .frame {
        padding: 22px 16px 20px;
      }
      .main-title {
        font-size: 22px;
        letter-spacing: 0.2em;
      }
    }
  </style>
</head>

  </div>
</body>
</html>
